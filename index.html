<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7fb" />
    <meta name="description" content="Panel de control de Contabilidad y Finanzas." />
    <title>Contabilidad y Finanzas | Atlas ERP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="Navegación principal">
        <a class="brand" href="#dashboard" aria-label="Atlas ERP, ir al panel">
          <span class="brand-mark" aria-hidden="true"
            ><svg viewBox="0 0 36 36">
              <path d="M18 3 33 11.5v13L18 33 3 24.5v-13L18 3Z" />
              <path d="m11 22 4.2-10h5.6L25 22M13 18h10M14.5 22l-2 3M21.5 22l2 3" /></svg
          ></span>
          <span class="brand-copy"><strong>atlas</strong><small>ERP WORKSPACE</small></span>
          <button
            class="sidebar-toggle"
            id="sidebar-toggle"
            type="button"
            aria-label="Contraer menú"
            aria-expanded="true"
            aria-controls="sidebar"
          >
            <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6" /></svg>
          </button>
        </a>
        <div class="workspace-switcher">
          <span class="workspace-avatar">N</span
          ><span class="workspace-copy"><strong>Nova Studio</strong><small>Plan Business</small></span
          ><svg class="chevron" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5" /></svg>
        </div>
        <p class="nav-caption">ESPACIO DE TRABAJO</p>
        <nav class="main-nav">
          <button class="nav-item active" data-view="dashboard" aria-current="page">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="3" width="8" height="8" rx="2" />
              <rect x="13" y="3" width="8" height="5" rx="2" />
              <rect x="13" y="10" width="8" height="11" rx="2" />
              <rect x="3" y="13" width="8" height="8" rx="2" /></svg
            ><span>Panel general</span>
          </button>
          <button class="nav-item" data-view="transacciones">
            <svg viewBox="0 0 24 24">
              <path d="M4 5h16M4 12h16M4 19h16" />
              <circle cx="8" cy="5" r="1" />
              <circle cx="16" cy="12" r="1" />
              <circle cx="10" cy="19" r="1" /></svg
            ><span>Transacciones</span><span class="nav-count">12</span>
          </button>
          <button class="nav-item" data-view="nueva-transaccion">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg><span>Nueva transacción</span>
          </button>
          <button class="nav-item" data-view="plan-cuentas">
            <svg viewBox="0 0 24 24"><path d="M4 20V9l8-5 8 5v11M8 20v-6h8v6M3 20h18" /></svg
            ><span>Plan de cuentas</span>
          </button>
          <button class="nav-item" data-view="consulta">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="5" width="18" height="16" rx="2" />
              <path d="M16 3v4M8 3v4M3 11h18" /></svg
            ><span>Consulta</span></button
          >
          <button class="nav-item" data-view="centros-costo">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="9" />
              <circle cx="12" cy="12" r="4" />
              <path d="M12 3v5m9 4h-5m-4 9v-5m-9-4h5" /></svg
            ><span>Centros de costo</span>
          </button>
          <button class="nav-item" data-view="reportes">
            <svg viewBox="0 0 24 24"><path d="M4 19V5m0 14h17M8 15l4-5 3 2 5-7" /></svg><span>Reportes</span>
          </button>
        </nav>
        <p class="nav-caption nav-caption-lower">ADMINISTRACIÓN</p>
        <nav class="main-nav">
          <button class="nav-item" data-view="auditoria">
            <svg viewBox="0 0 24 24">
              <path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11Z" />
              <path d="m9 12 2 2 4-4" /></svg
            ><span>Auditoría</span>
          </button>
          <button class="nav-item" data-view="configuracion">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="3" />
              <path
                d="m19.4 15 .1.1a1.7 1.7 0 0 1-2.4 2.4l-.1-.1a1.7 1.7 0 0 0-2.9 1.2v.2a1.7 1.7 0 0 1-3.4 0v-.2A1.7 1.7 0 0 0 7.8 17l-.1.1a1.7 1.7 0 0 1-2.4-2.4l.1-.1a1.7 1.7 0 0 0-1.2-2.9H4a1.7 1.7 0 0 1 0-3.4h.2A1.7 1.7 0 0 0 5.4 6.3l-.1-.1a1.7 1.7 0 0 1 2.4-2.4l.1.1a1.7 1.7 0 0 0 2.9-1.2v-.2a1.7 1.7 0 0 1 3.4 0v.2A1.7 1.7 0 0 0 17 3.9l.1-.1a1.7 1.7 0 0 1 2.4 2.4l-.1.1a1.7 1.7 0 0 0 1.2 2.9h.2a1.7 1.7 0 0 1 0 3.4h-.2a1.7 1.7 0 0 0-1.3 2.4Z"
              /></svg
            ><span>Configuración</span>
          </button>
        </nav>
        <div class="sidebar-spacer"></div>
        <div class="help-card">
          <span class="help-icon"
            ><svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="9" />
              <path d="M9.6 9a2.5 2.5 0 1 1 4.3 1.7c-1 .9-1.9 1.3-1.9 2.8M12 17h.01" /></svg></span
          ><span><strong>¿Necesitas ayuda?</strong><small>Visita nuestro centro de soporte</small></span
          ><button class="icon-button" aria-label="Abrir ayuda">
            <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></svg>
          </button>
        </div>
        <button class="profile-button">
          <span class="profile-avatar">CM</span
          ><span class="profile-copy"><strong>Camila Méndez</strong><small>Gerente de Finanzas</small></span
          ><svg class="chevron" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5" /></svg>
        </button>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div class="breadcrumbs">
            <span>Finanzas</span><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6" /></svg
            ><strong id="breadcrumb-current">Panel general</strong>
          </div>
          <div class="topbar-actions">
            <span class="period-label"><span class="status-dot"></span>Período fiscal activo</span
            ><button class="icon-button notification-button" aria-label="Notificaciones">
              <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" /></svg
              ><i></i></button
            ><span class="topbar-divider"></span
            ><button class="topbar-profile">
              <span class="profile-avatar small">CM</span
              ><svg class="chevron" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5" /></svg>
            </button>
          </div>
        </header>

        <div class="page-wrap">
          <section class="view" id="view-dashboard"></section>
          <section class="view placeholder-view" id="view-placeholder" hidden></section>
        </div>
      </main>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
